name: v3 CI

# Issue #544: the light half of v3 CI, run once per pull request — lint,
# format, typecheck and the unit tests of the areas a change touches. The
# heavy half (the full server suite including the `integration` tests, the
# SPEC-113 e2e scenarios, the dashboard and docs-site builds, the signed MCP
# bundle, the dependency audits) runs in `v3-ci-batch.yml`, dispatched on
# `main` after a series of merges; a release needs a green batch on its commit.
#
# No `push` trigger: a merge does not run the same checks a second time
# (CI standard, cost rule 13). No `branches:` filter on `pull_request`, so a
# PR stacked on another branch gets its checks too (trigger rule 1).
#
# Issue #487: no workflow-level path filter either. A workflow that does not
# trigger never reports its checks, so none of them could be required on
# `main`. The workflow always runs; the `changes` job below decides which
# lanes have anything to do, and the `v3-ci-required` gate at the bottom is
# the one check that always reports.
on:
  pull_request:

permissions:
  contents: read

# Issue #421: a new push to the same PR cancels the in-flight run instead of
# letting a superseded run finish.
concurrency:
  group: v3-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Issue #421: path-scope the lanes. A change confined to one area (the
  # dashboard, the sdk, the docs site, the bundle tooling, …) does not spin up
  # every job. The `python` lane is gated only on the track (`v3`),
  # deliberately not on an area: the doc/copy-lint tests are woven through
  # the suite (server/tests/docs_site, *_copy_lint.py, test_migration_guide_*,
  # clients/skill_lint.py, deploy/test_store_manifests.py, …), so making
  # docs-only PRs skip it would silently drop coverage. Every filter also
  # lists the v3 workflow files so that editing them re-runs the lanes they
  # govern — they count as v3 (issue #392): test_release_workflow.py and
  # test_pi_image.py pin their structure.
  #
  # On a PR, dorny/paths-filter lists the PR's files through the API.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      v3: ${{ steps.filter.outputs.v3 }}
      web: ${{ steps.filter.outputs.web }}
      docs_site: ${{ steps.filter.outputs.docs_site }}
      mcpb: ${{ steps.filter.outputs.mcpb }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Generous on purpose: over-running a fast lane is cheap, skipping a
          # lane that was actually affected is not. `clients/**` feeds both the
          # dashboard and the docs-site generated "Connect your AI" pages;
          # `design/**` (tokens.json and its generator) feeds both stylesheets.
          filters: |
            v3:
              - 'v3/**'
              - '.github/workflows/v3-*.yml'
            web:
              - 'v3/web/**'
              - 'v3/clients/**'
              - 'v3/design/**'
              - 'v3/site/docs/src/styles/palaia-tokens.css'
              - '.github/workflows/v3-*.yml'
            docs_site:
              - 'v3/site/**'
              - 'v3/clients/**'
              - 'v3/design/**'
              - '.github/workflows/v3-*.yml'
            mcpb:
              - 'v3/tools/build-mcpb/**'
              - '.github/workflows/v3-*.yml'
            sdk:
              - 'v3/sdk/**'
              - '.github/workflows/v3-*.yml'

  python:
    needs: changes
    if: ${{ needs.changes.outputs.v3 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          # Issue #405: cache the resolved environment between runs instead
          # of cold-resolving `uv sync` in every job.
          enable-cache: true
          cache-dependency-glob: "v3/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      # Cheap checks first: a lint or lockfile mistake stops the lane
      # before the tests start.
      - name: the lockfile matches the manifests
        run: uv lock --check

      - name: uv sync
        run: uv sync --all-packages

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        # Issue #407: formatting is enforced. Fix locally with `just fmt`.
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy server/src

      # Same Node and bundle tooling as the batch, so a unit test that
      # shells out to node or the `mcpb` CLI runs here instead of skipping.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/tools/build-mcpb/package-lock.json

      - name: npm ci (mcpb build tooling)
        working-directory: v3/tools/build-mcpb
        run: npm ci

      - name: pytest (unit)
        # The server suite without the tests marked `integration` (real hub
        # subprocesses, real bundle packing, real installer runs — see the
        # marker in v3/pyproject.toml). Those, and the SPEC-113 e2e
        # scenarios, run in v3-ci-batch.yml. pytest exits non-zero if the
        # selection collects no test at all.
        # --durations: the slowest tests, in the log (issue #405).
        run: uv run pytest --ignore=server/tests/e2e -m "not integration" --durations=10

  sdk:
    # v3/sdk is its own uv project on purpose (independently installable,
    # no dependency on palaia_hub — see v3/justfile). Until issue #401 only
    # `ruff check .` from the workspace root ever looked at it in CI; its
    # tests and its own mypy run were `just sdk-test`/`sdk-lint`, by hand.
    needs: changes
    if: ${{ needs.changes.outputs.sdk == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: "v3/sdk/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q

  mcpb:
    # The bundle proxy's own unit tests. Building, packing and signing the
    # bundle (SPEC-306 deliverable #2) runs in v3-ci-batch.yml.
    needs: changes
    if: ${{ needs.changes.outputs.mcpb == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/tools/build-mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/tools/build-mcpb/package-lock.json

      - name: npm ci
        run: npm ci

      - name: proxy unit tests
        run: npm test

  web:
    # Lint, typecheck and unit tests. The production build runs in
    # v3-ci-batch.yml.
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm test

  docs-site:
    # SPEC-503: the user docs site. Lint, typecheck, the generated-page
    # drift check and unit tests; the site build and its internal link check
    # run in v3-ci-batch.yml.
    needs: changes
    if: ${{ needs.changes.outputs.docs_site == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/site/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/site/docs/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # The drift test: clients.ts/skills.ts changed without regenerating
      # the "Connect your AI" pages fails right here.
      - name: connect-page drift check
        run: npm run check:generated

      - name: vitest
        run: npm test

      # The jargon lint (shared blocklist, "prose only" — SPEC-503
      # deliverable #3) scans the committed Markdown directly, so it runs in
      # the `python` lane above, via server/tests/docs_site/.

  # Issue #487: the required check on `main`. It always reports, whatever
  # the paths: it fails if any lane failed or was cancelled, and passes when
  # every lane passed or was skipped because its area was untouched.
  # `if: always()` rather than `!cancelled()` on purpose: a skipped required
  # check counts as passing, so a cancelled run (a superseded push, see
  # `concurrency` above) must report a failure here, not skip the gate.
  # `changes` is in `needs` so a broken filter fails the gate instead of
  # silently skipping every lane. A new lane must be added to `needs` too —
  # test_release_workflow.py checks that.
  required:
    name: v3-ci-required
    needs: [changes, python, sdk, mcpb, web, docs-site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every lane passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::a v3 CI lane failed or was cancelled"
            exit 1
          fi
