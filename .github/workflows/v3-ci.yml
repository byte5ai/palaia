name: v3 CI

on:
  push:
    branches: [main]
    # The v3 workflow files count as v3 (issue #392): test_release_workflow.py
    # and test_pi_image.py pin their structure, so a PR that edits only one
    # of them must run this CI, not just the v2 one.
    paths: ['v3/**', '.github/workflows/v3-*.yml']
  pull_request:
    branches: [main]
    paths: ['v3/**', '.github/workflows/v3-*.yml']

# Issue #421: a new push to the same PR (or branch) cancels the in-flight run
# instead of letting a now-superseded full matrix run to completion on the
# shared runner quota.
concurrency:
  group: v3-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Issue #421: path-scope the heavy lanes. A change confined to one area
  # (the dashboard, the sdk, the docs site, the bundle tooling, …) no longer
  # spins up every job. The `python` job is deliberately NOT gated here: the
  # doc/copy-lint tests are woven through the suite (server/tests/docs_site,
  # *_copy_lint.py, test_migration_guide_*, clients/skill_lint.py,
  # deploy/test_store_manifests.py, …), so making docs-only PRs skip it would
  # silently drop coverage. Splitting those out so docs PRs can skip the full
  # suite is tracked separately. Every filter also lists the v3 workflow files
  # so that editing this file re-runs the lanes it governs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      docs_site: ${{ steps.filter.outputs.docs_site }}
      mcpb: ${{ steps.filter.outputs.mcpb }}
      sdk: ${{ steps.filter.outputs.sdk }}
      e2e: ${{ steps.filter.outputs.e2e }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Generous on purpose: over-running a fast lane is cheap, skipping a
          # lane that was actually affected is not. `clients/**` feeds both the
          # dashboard and the docs-site generated "Connect your AI" pages.
          filters: |
            web:
              - 'v3/web/**'
              - 'v3/clients/**'
              - '.github/workflows/v3-*.yml'
            docs_site:
              - 'v3/site/**'
              - 'v3/clients/**'
              - '.github/workflows/v3-*.yml'
            mcpb:
              - 'v3/tools/build-mcpb/**'
              - 'v3/server/**'
              - '.github/workflows/v3-*.yml'
            sdk:
              - 'v3/sdk/**'
              - '.github/workflows/v3-*.yml'
            e2e:
              - 'v3/server/**'
              - 'v3/clients/**'
              - 'v3/tools/**'
              - 'v3/pyproject.toml'
              - 'v3/uv.lock'
              - '.github/workflows/v3-*.yml'
            deps:
              - 'v3/**/pyproject.toml'
              - 'v3/**/uv.lock'
              - 'v3/**/package.json'
              - 'v3/**/package-lock.json'
              - '.github/workflows/v3-*.yml'

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          # Issue #405: cache the resolved environment between runs instead
          # of cold-resolving `uv sync` in every job.
          enable-cache: true
          cache-dependency-glob: "v3/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --all-packages

      # SPEC-306: server/tests/mcpb's real-pack tests need the `mcpb` CLI
      # on PATH (via a local devDependency install) — without this they
      # skip cleanly rather than fail, but skipping in CI would silently
      # stop proving the acceptance criterion, so it is installed here.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v3/tools/build-mcpb/package-lock.json

      - name: npm ci (mcpb build tooling)
        working-directory: v3/tools/build-mcpb
        run: npm ci

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy server/src

      - name: pytest
        # SPEC-113's e2e scenario suite gets its own job below (dedicated
        # timeout + failure-artifact capture), so it is excluded here to
        # avoid running it twice on every push/PR.
        # --durations: the slowest tests, in the log, so the ten-minute wall
        # clock has names attached (issue #405).
        run: uv run pytest --ignore=server/tests/e2e --durations=10

  sdk:
    # v3/sdk is its own uv project on purpose (independently installable,
    # no dependency on palaia_hub — see v3/justfile). Until issue #401 only
    # `ruff check .` from the workspace root ever looked at it in CI; its
    # tests and its own mypy run were `just sdk-test`/`sdk-lint`, by hand.
    needs: changes
    if: ${{ needs.changes.outputs.sdk == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          # Issue #405: cache the resolved environment between runs instead
          # of cold-resolving `uv sync` in every job.
          enable-cache: true
          cache-dependency-glob: "v3/sdk/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q

  e2e:
    # SPEC-113: the Phase-1 exit-criterion harness (S1-S5) — real hub
    # subprocesses over the golden vault fixture, real streamable HTTP,
    # amd64 (this runner's arch).
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          # Issue #405: cache the resolved environment between runs instead
          # of cold-resolving `uv sync` in every job.
          enable-cache: true
          cache-dependency-glob: "v3/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --all-packages

      # SPEC-306: test_mcpb_proxy.py spawns the real palaia-proxy.mjs as a
      # Node subprocess. No `npm ci` needed here — the proxy is a
      # self-contained script (Node builtins only).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: e2e scenario suite
        # --basetemp puts every scenario's tmp_path (hub subprocess logs,
        # the golden-vault copy each scenario mutates, progress logs) under
        # a directory this job controls, so a failure's reproducible bundle
        # (SPEC-113 acceptance: "logs + vault + config") is exactly what
        # gets uploaded below, pass or fail.
        run: uv run pytest server/tests/e2e -v --basetemp=e2e-artifacts

      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-bundle
          path: v3/e2e-artifacts
          retention-days: 14

  mcpb:
    # SPEC-306 deliverable #2: the packed bundle validates against the
    # MCPB manifest schema, and the build is reproducible in CI — proven
    # by actually running it here, not by running `build.mjs` only on a
    # developer's machine.
    needs: changes
    if: ${{ needs.changes.outputs.mcpb == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/tools/build-mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v3/tools/build-mcpb/package-lock.json

      - name: npm ci
        run: npm ci

      - name: proxy unit tests
        run: npm test

      - name: build (validate + pack + sign)
        run: npm run build

      - name: verify the packed bundle unpacks to a valid manifest + a real signature block
        run: |
          rm -rf /tmp/mcpb-unpacked
          node_modules/.bin/mcpb unpack dist/palaia.mcpb /tmp/mcpb-unpacked
          node_modules/.bin/mcpb validate /tmp/mcpb-unpacked/manifest.json
          node -e "
            const data = require('fs').readFileSync('dist/palaia.mcpb');
            if (!data.includes('MCPB_SIG_V1') || !data.includes('MCPB_SIG_END')) {
              console.error('no PKCS#7 signature block found in the packed bundle');
              process.exit(1);
            }
            console.log('signature block present (' + data.length + ' bytes total)');
          "

      - name: upload the built bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palaia-mcpb
          path: v3/tools/build-mcpb/dist/palaia.mcpb
          retention-days: 14

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v3/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm test

      - name: build
        run: npm run build

  dependency-audit:
    # SPEC-502 deliverable #2, the dependency half. Reports without gating,
    # on purpose: a third party publishing an advisory overnight must not
    # turn every branch red until someone wakes up, because a build that is
    # red for reasons outside the change trains people to ignore it. What
    # gates instead is the policy in v3/docs/security/dependencies.md — a
    # high/critical advisory in something a user actually runs blocks the
    # next release, checked at release time with a human present.
    #
    # `uv lock --check` is the exception and DOES gate: a manifest edited
    # without re-locking is this repository's own mistake, not the world's.
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          # Issue #405: cache the resolved environment between runs instead
          # of cold-resolving `uv sync` in every job.
          enable-cache: true
          cache-dependency-glob: "v3/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: the lockfile matches the manifests
        working-directory: v3
        run: uv lock --check

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # Issue #405: the two `npm ci` below used to fetch cold every run.
          cache: 'npm'
          cache-dependency-path: |
            v3/web/package-lock.json
            v3/tools/build-mcpb/package-lock.json

      # Each audit still never fails the run (see above), but its findings
      # are no longer buried in a green job's log (issue #401): they go into
      # the job summary and raise a workflow warning annotation, so the run
      # page itself says "advisories found" to whoever opens it.
      - name: python advisories (runtime dependencies)
        working-directory: v3
        continue-on-error: true
        run: |
          uv export --no-hashes --no-dev -o /tmp/runtime-reqs.txt
          bash ../.github/scripts/report-audit.sh "pip-audit (runtime)" \
            uv run --with pip-audit pip-audit --no-deps --disable-pip -r /tmp/runtime-reqs.txt

      - name: python advisories (including development dependencies)
        working-directory: v3
        continue-on-error: true
        run: |
          uv export --no-hashes -o /tmp/all-reqs.txt
          bash ../.github/scripts/report-audit.sh "pip-audit (all)" \
            uv run --with pip-audit pip-audit --no-deps --disable-pip -r /tmp/all-reqs.txt

      - name: node advisories (dashboard)
        working-directory: v3/web
        continue-on-error: true
        run: |
          npm ci
          bash ../../.github/scripts/report-audit.sh "npm audit (dashboard)" npm audit

      - name: node advisories (bundle build tooling)
        working-directory: v3/tools/build-mcpb
        continue-on-error: true
        run: |
          npm ci
          bash ../../../.github/scripts/report-audit.sh "npm audit (mcpb tooling)" npm audit

  docs-site:
    # SPEC-503: the user docs site, in the same web lane as the dashboard
    # build above — a separate job (its own npm project/lockfile, no
    # shared build tooling with v3/web) rather than a step, so a docs-site
    # failure is attributed clearly and the two builds run in parallel.
    needs: changes
    if: ${{ needs.changes.outputs.docs_site == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/site/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v3/site/docs/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # The drift test: clients.ts/skills.ts changed without regenerating
      # the "Connect your AI" pages fails right here, before the build
      # step below would otherwise mask it by using the stale committed
      # pages successfully.
      - name: connect-page drift check
        run: npm run check:generated

      - name: vitest
        run: npm test

      # astro build, then the broken-internal-link checker over its own
      # output (SPEC-503 deliverable #4).
      - name: build (site + internal link check)
        run: npm run build

      # The jargon lint (shared blocklist, "prose only" — SPEC-503
      # deliverable #3) scans the committed Markdown directly, not the
      # build output, so it needs no Node/Astro step at all — it already
      # runs in the `python` job above, via that job's ordinary
      # `uv run pytest` over server/tests/docs_site/.
