name: v3 CI batch

# Issue #544: the heavy half of v3 CI. Pull requests run only the light checks
# (`v3-ci.yml`: lint, typecheck, unit tests of what the change touches). This
# workflow runs everything — the full server suite, the SPEC-113 e2e
# scenarios, the dashboard and docs-site builds, the signed MCP bundle, the
# dependency audits — on one commit, started by hand on `main` after a series
# of merges. One green run covers all of them.
#
# - Dispatch only: no push, pull_request or schedule trigger (CI standard,
#   cost rules 7 and 9). test_release_workflow.py pins that.
# - A red batch is fixed or reverted before further merges.
# - A release is cut only from a `main` commit with a green batch:
#   v3-cut-release.yml checks it through v3/tools/release_batch_gate.py, which
#   requires every job below to have passed. A job added here must be added to
#   that script's REQUIRED_JOBS; test_release_workflow.py fails until it is.
on:
  workflow_dispatch:

permissions:
  contents: read

# A running batch is never cancelled; a second dispatch waits (cost rule 5).
concurrency:
  group: v3-ci-batch-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          # Issue #405: cache the resolved environment between runs instead
          # of cold-resolving `uv sync` in every job.
          enable-cache: true
          cache-dependency-glob: "v3/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --all-packages

      # SPEC-306: server/tests/mcpb's real-pack tests need the `mcpb` CLI
      # on PATH (via a local devDependency install) — without this they
      # skip cleanly rather than fail, but skipping in CI would silently
      # stop proving the acceptance criterion, so it is installed here.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/tools/build-mcpb/package-lock.json

      - name: npm ci (mcpb build tooling)
        working-directory: v3/tools/build-mcpb
        run: npm ci

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy server/src

      - name: pytest (full suite)
        # Every server test, the `integration` ones included — the PR lane
        # in v3-ci.yml leaves those out. SPEC-113's e2e scenarios have their
        # own job below (timeout + failure bundle), so they are excluded here.
        # --durations: the slowest tests, in the log (issue #405).
        run: uv run pytest --ignore=server/tests/e2e --durations=10

  sdk:
    # v3/sdk is its own uv project on purpose (independently installable,
    # no dependency on palaia_hub — see v3/justfile).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: "v3/sdk/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q

  e2e:
    # SPEC-113: the Phase-1 exit-criterion harness (S1-S5) — real hub
    # subprocesses over the golden vault fixture, real streamable HTTP,
    # amd64 (this runner's arch).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: "v3/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv sync
        run: uv sync --all-packages

      # SPEC-306: test_mcpb_proxy.py spawns the real palaia-proxy.mjs as a
      # Node subprocess. No `npm ci` needed here — the proxy is a
      # self-contained script (Node builtins only).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: e2e scenario suite
        # --basetemp puts every scenario's tmp_path (hub subprocess logs,
        # the golden-vault copy each scenario mutates, progress logs) under
        # a directory this job controls, so a failure's reproducible bundle
        # (SPEC-113 acceptance: "logs + vault + config") is exactly what
        # gets uploaded below.
        run: uv run pytest server/tests/e2e -v --basetemp=e2e-artifacts

      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-bundle
          path: v3/e2e-artifacts
          retention-days: 7

  mcpb:
    # SPEC-306 deliverable #2: the packed bundle validates against the
    # MCPB manifest schema, and the build is reproducible in CI — proven
    # by actually running it here, not only on a developer's machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/tools/build-mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/tools/build-mcpb/package-lock.json

      - name: npm ci
        run: npm ci

      - name: proxy unit tests
        run: npm test

      - name: build (validate + pack + sign)
        run: npm run build

      - name: verify the packed bundle unpacks to a valid manifest + a real signature block
        run: |
          rm -rf /tmp/mcpb-unpacked
          node_modules/.bin/mcpb unpack dist/palaia.mcpb /tmp/mcpb-unpacked
          node_modules/.bin/mcpb validate /tmp/mcpb-unpacked/manifest.json
          node -e "
            const data = require('fs').readFileSync('dist/palaia.mcpb');
            if (!data.includes('MCPB_SIG_V1') || !data.includes('MCPB_SIG_END')) {
              console.error('no PKCS#7 signature block found in the packed bundle');
              process.exit(1);
            }
            console.log('signature block present (' + data.length + ' bytes total)');
          "

      - name: upload the built bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palaia-mcpb
          path: v3/tools/build-mcpb/dist/palaia.mcpb
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm test

      - name: build
        run: npm run build

  docs-site:
    # SPEC-503: the user docs site — a separate job from the dashboard (its
    # own npm project/lockfile), so a failure is attributed clearly.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v3/site/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: v3/site/docs/package-lock.json

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: connect-page drift check
        run: npm run check:generated

      - name: vitest
        run: npm test

      # astro build, then the broken-internal-link checker over its own
      # output (SPEC-503 deliverable #4).
      - name: build (site + internal link check)
        run: npm run build

  dependency-audit:
    # SPEC-502 deliverable #2, the dependency half. Reports without gating,
    # on purpose: a third party publishing an advisory overnight must not
    # turn the batch red until someone wakes up. What gates instead is the
    # policy in v3/docs/security/dependencies.md — a high/critical advisory
    # in something a user actually runs blocks the next release, checked at
    # release time with a human present; this batch run is where they look.
    #
    # `uv lock --check` is the exception and DOES gate (here and on every PR,
    # in v3-ci.yml): a manifest edited without re-locking is this
    # repository's own mistake, not the world's.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: "v3/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: the lockfile matches the manifests
        working-directory: v3
        run: uv lock --check

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            v3/web/package-lock.json
            v3/tools/build-mcpb/package-lock.json

      # Each audit never fails the run (see above), but its findings are not
      # buried in a green job's log (issue #401): they go into the job
      # summary and raise a workflow warning annotation.
      # The runtime set is what deploy/Dockerfile installs: the hub package
      # with its embeddings extra, no dev groups. The workspace root is
      # virtual and depends on nothing outside its dev group, so a bare
      # `uv export --no-dev` lists no package at all, and the audit then
      # reported a clean runtime while the image shipped high and critical
      # advisories. An empty list is this repository's mistake, so this step
      # gates.
      - name: the runtime export lists what the image installs
        working-directory: v3
        run: |
          uv export --no-hashes --no-dev --package palaia --extra embeddings \
            --no-emit-project -o /tmp/runtime-reqs.txt
          count=$(grep -c '==' /tmp/runtime-reqs.txt || true)
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::the runtime export lists no package, so the runtime audit would check nothing"
            exit 1
          fi
          echo "runtime export: ${count} packages"

      - name: python advisories (runtime dependencies)
        working-directory: v3
        continue-on-error: true
        run: |
          bash ../.github/scripts/report-audit.sh "pip-audit (runtime)" \
            uv run --with pip-audit pip-audit --no-deps --disable-pip -r /tmp/runtime-reqs.txt

      - name: python advisories (including development dependencies)
        working-directory: v3
        continue-on-error: true
        run: |
          uv export --no-hashes -o /tmp/all-reqs.txt
          bash ../.github/scripts/report-audit.sh "pip-audit (all)" \
            uv run --with pip-audit pip-audit --no-deps --disable-pip -r /tmp/all-reqs.txt

      - name: node advisories (dashboard)
        working-directory: v3/web
        continue-on-error: true
        run: |
          npm ci
          bash ../../.github/scripts/report-audit.sh "npm audit (dashboard)" npm audit

      - name: node advisories (bundle build tooling)
        working-directory: v3/tools/build-mcpb
        continue-on-error: true
        run: |
          npm ci
          bash ../../../.github/scripts/report-audit.sh "npm audit (mcpb tooling)" npm audit
