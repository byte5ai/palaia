version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: palaia_hub_1
      APP_PORT: 8420

  hub:
    image: ghcr.io/byte5ai/palaia-hub:stable
    # The image's own non-root user, pinned to 1000:1000 (v3/deploy/Dockerfile,
    # issue #329) — the ownership Umbrel gives ${APP_DATA_DIR}, so the bind
    # mount below is writable on first boot.
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PALAIA_MODE: locked
      PALAIA_DEPLOYMENT: umbrel
    volumes:
      - ${APP_DATA_DIR}/data:/data
