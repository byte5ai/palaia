    # The one byte5 contact this repository actually attests (the project
    # author in the root `pyproject.toml`). The address that stood here
    # before, `hello@byte5.ai`, appeared nowhere else in the repository and
    # nothing could show it is read (issue #400). The schema requires a
    # maintainer email, so this is a replacement, not a removal — security
    # reports still go through GitHub private vulnerability reporting, the
    # only monitored channel (v3/SECURITY.md).
    email: hello@byte5.de
app_version: "0.1.0"
# The catalog item's own version (semver, per the truenas/apps catalog);
# bumped when this package changes, independently of app_version.
version: "1.0.0"
human_version: "0.1.0_1"
# The shared template library from truenas/apps' own `library/` directory
# (issue #400). Both values are read off that repository, not guessed:
# `library/hashes.yaml` @ master maps 2.3.13 to this digest, and shipped
# community apps carry the same pair (e.g. ix-dev/community/arcane).
# Caveat before submitting: declaring the library is not the same as using
# it — `templates/docker-compose.yaml` here is still hand-written compose
# rather than the `ix_lib.base.render.Render` form every listed app uses.
# See SUBMIT.md.
lib_version: 2.3.13
lib_version_hash: 644cb2c53051941e9128fbd4d666094573af5c57a62c037bc56820d25427e454
capabilities: []
# The image runs as its own non-root `palaia` user, pinned to uid/gid 1000
# (v3/deploy/Dockerfile, issue #329) — the same pair ix_values.yaml feeds
# the compose template's `user:`.
run_as_context:
  - description: palaia runs as the image's own non-root user.
    gid: 1000
    group_name: palaia
    uid: 1000
    user_name: palaia
host_mounts: []
annotations:
  min_scale_version: "24.04.0"
changelog_url: https://github.com/byte5ai/palaia/releases
