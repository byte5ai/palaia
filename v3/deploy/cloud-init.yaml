#cloud-config
# palaia v3 — VPS install (SPEC-601). Paste this whole file into your
# provider's server-creation user-data field — Hetzner Cloud calls it
# "Cloud config", DigitalOcean calls it "User data" — then create
# the server. Everything below runs itself: no terminal, no SSH session
# needed to finish setup.
#
# ONE THING TO EDIT — find this line further down and replace the
# placeholder with a setup code of your own (12 letters/digits, e.g.
# K7QM-R2XD-9FTP; your AI assistant can make one up for you):
#
#     PALAIA_SETUP_CODE="setup-code-REPLACE_ME"
#
# A few minutes after the server starts, open http://<server-address>:8420/,
# enter that code and click "Connect with Tailscale" — the server joins your
# private network (tailnet). The same page then offers cloud access for
# ChatGPT and Claude, and closes itself (SPEC-605).
#
# Prefer a key? Instead fill in the TAILSCALE_AUTH_KEY line below with an
# auth key from https://login.tailscale.com/admin/settings/keys; then no
# setup page is shown. Use a one-time key: it also stays in the provider's
# copy of this file. Nothing else in this file needs to change.
#
# What it does: runs palaia's installer (https://get.palaia.ai/install, the
# same script as `curl -fsSL https://get.palaia.ai | sh`), which installs
# Docker and Tailscale, joins your tailnet, switches the firewall on (SSH
# stays open) and starts the hub bound to the tailnet address only — so the
# hub is never reachable from the public internet, only from your own
# devices. See v3/deploy/README.md's "Cloud-init" section for what the data
# volume holds and how to back it up or move it.
#
# This runs once per server — cloud-init's own rule. Running it again by
# hand (`sudo sh /opt/palaia/cloud-init-setup.sh`) is safe: the installer
# keeps your data and changes nothing that is already in place.
#
# Everything this does is also logged to /var/log/cloud-init-output.log —
# check there first if the hub does not come up.
package_update: true
packages:
  - ca-certificates
  - curl
  - python3
  - ufw
write_files:
  - path: /opt/palaia/cloud-init-setup.sh
    permissions: "0700"
    owner: root:root
    content: |
      #!/bin/sh
      # Written by cloud-init.yaml — see that file for the one thing to
      # edit. Safe to run again: the installer keeps what is already done.
      set -eu

      log() { echo "palaia cloud-init: $*"; }

      PALAIA_SETUP_CODE="setup-code-REPLACE_ME"
      TAILSCALE_AUTH_KEY="tskey-REPLACE_ME"
      INSTALLER_URL="https://get.palaia.ai/install"

      # Which way to join the tailnet: a filled-in key wins; otherwise the
      # setup page with the filled-in code. The checks below look only for
      # the marker word, so a copy where every placeholder was replaced
      # still passes them.
      USE_KEY=1
      case "${TAILSCALE_AUTH_KEY}" in *REPLACE_ME*|"") USE_KEY=0 ;; esac
      if [ "$USE_KEY" = "0" ]; then
          case "${PALAIA_SETUP_CODE}" in
              *REPLACE_ME*|"")
                  log "ERROR: edit this file's PALAIA_SETUP_CODE (or TAILSCALE_AUTH_KEY) before pasting it."
                  exit 1 ;;
          esac
      fi

      # --- Run the installer ----------------------------------------------
      log "downloading the installer from ${INSTALLER_URL} ..."
      curl -fsSL --retry 5 --retry-delay 5 "${INSTALLER_URL}" -o /opt/palaia/get-palaia.sh
      # The key goes into a file only root can read — only now, once the
      # installer is here to delete it again: it hands the key to Tailscale
      # as `--auth-key=file:...` (never a command-line argument) and removes
      # the file however it ends.
      if [ "$USE_KEY" = "1" ]; then
          ( umask 077 && printf '%s' "${TAILSCALE_AUTH_KEY}" > /root/.palaia-tskey )
          export PALAIA_TSKEY_FILE=/root/.palaia-tskey
      fi
      export PALAIA_SETUP_CODE
      # A server created for palaia: switch ufw on (SSH stays open).
      export PALAIA_FIREWALL=on
      log "running the installer ..."
      sh /opt/palaia/get-palaia.sh </dev/null

runcmd:
  - [sh, /opt/palaia/cloud-init-setup.sh]
