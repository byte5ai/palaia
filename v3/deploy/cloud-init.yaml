#cloud-config
# palaia v3 — VPS install (SPEC-601). Paste this whole file into your
# provider's server-creation user-data field — Hetzner Cloud calls it
# "Cloud config", DigitalOcean calls it "User data" — then create
# the server. Everything below runs itself: no terminal, no SSH session
# needed to finish setup.
#
# ONE THING TO EDIT — find this line further down and replace the
# placeholder with a setup code of your own (12 letters/digits, e.g.
# K7QM-R2XD-9FTP; your AI assistant can make one up for you):
#
#     PALAIA_SETUP_CODE="setup-code-REPLACE_ME"
#
# A few minutes after the server starts, open http://<server-address>:8420/,
# enter that code and click "Connect with Tailscale" — the server joins your
# private network (tailnet) and the page closes itself (SPEC-605).
#
# Prefer a key? Instead fill in the TAILSCALE_AUTH_KEY line below with an
# auth key from https://login.tailscale.com/admin/settings/keys; then no
# setup page is shown. Nothing else in this file needs to change.
#
# What it does: installs Docker and Tailscale, joins your private network
# (tailnet) via the setup page or your key, starts the hub with the exact same
# hardened container flags v3/deploy/install.sh uses (never a second,
# hand-copied list — see server/tests/deploy/test_cloud_init.py's drift
# check), and binds the hub's published port to the tailnet address only
# plus a firewall rule that denies it everywhere else — so the hub is
# never reachable from the public internet, only from your own devices on
# the tailnet. See v3/deploy/README.md's "Cloud-init" section for what
# the data volume holds and how to back it up or move it.
#
# This step (installing Docker/Tailscale/the hub itself) only runs once
# per server — cloud-init's own rule, not this file's. The script it
# writes below is still written so that running it a second time by hand
# (`sudo bash /opt/palaia/cloud-init-setup.sh`) changes nothing that is
# already in place, in case you ever need to re-apply it.
#
# Everything this does is also logged to /var/log/cloud-init-output.log —
# check there first if the hub does not come up.
package_update: true
packages:
  - ca-certificates
  - curl
  - ufw
write_files:
  # Issue #400: the container binds to the tailnet address. After a reboot
  # Docker may restart it before tailscaled has that address, and the port
  # bind fails (EADDRNOTAVAIL) until `--restart unless-stopped` retries.
  # Starting Docker after tailscaled shortens that window to nothing in the
  # common case; the restart policy still covers the rest.
  - path: /etc/systemd/system/docker.service.d/palaia-after-tailscale.conf
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
  # SPEC-605: the one-time setup page — v3/deploy/setup-page.py verbatim
  # (server/tests/deploy/test_setup_page.py checks the copy).
  - path: /opt/palaia/setup-page.py
    permissions: "0700"
    owner: root:root
    content: |
      #!/usr/bin/env python3
      # palaia v3 — one-time setup page (SPEC-605).
      #
      # Joins this server to the owner's Tailscale network without anyone handling
      # a key: it starts `tailscale up` without an auth key, takes the login link
      # Tailscale prints, and shows it on a small web page — but only to someone
      # who enters the one-time setup code. The person opens
      # http://<server-address>:8420/, types the code, clicks "Connect with
      # Tailscale" and logs in. When the server has its private-network address,
      # the page says where palaia will be, and this program exits 0.
      #
      # It exits 1 on timeout (default 30 minutes) or when Tailscale fails. Either
      # way the port is closed again the moment it exits; the installer then starts
      # the hub bound to the private-network address only, exactly as before.
      #
      # Standard library only — python3 is on every image that runs cloud-init.
      # The code comes from the PALAIA_SETUP_CODE environment variable, not the
      # command line, so it never shows up in a process list. Without one, a fresh
      # code is made up and printed together with the address to open.
      #
      # This file is the single source: get-palaia.sh and cloud-init.yaml embed
      # it verbatim (checked by server/tests/deploy/test_setup_page.py).

      import argparse
      import hmac
      import html
      import json
      import os
      import re
      import secrets
      import signal
      import socket
      import subprocess
      import sys
      import threading
      import time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      LOGIN_URL_RE = re.compile(r"https://\S+")
      WRONG_CODE_DELAY = 1.0
      MAX_CLIENTS = 32  # concurrent connections; more are dropped, not queued
      CLIENT_TIMEOUT = 10  # seconds a connection may take to send its request
      CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"  # no 0/O, 1/I look-alikes


      def log(message):
          print(f"palaia setup page: {message}", flush=True)


      def normalise(code):
          """Codes are compared without case, spaces or dashes."""
          return re.sub(r"[\s-]", "", code or "").upper()


      def new_code():
          raw = "".join(secrets.choice(CODE_ALPHABET) for _ in range(12))
          return f"{raw[:4]}-{raw[4:8]}-{raw[8:]}"


      def public_address():
          """The address this server reaches the internet from — no packet is sent."""
          try:
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                  sock.connect(("1.1.1.1", 80))
                  return sock.getsockname()[0]
          except OSError:
              return "<this server's address>"


      def tailnet_ip():
          try:
              out = subprocess.run(
                  ["tailscale", "ip", "-4"], capture_output=True, text=True, timeout=10, check=False
              )
          except (OSError, subprocess.TimeoutExpired):
              return None
          first = out.stdout.strip().splitlines()[:1]
          return first[0] if out.returncode == 0 and first else None


      class State:
          def __init__(self, code, port):
              self.code = normalise(code)
              self.port = port
              self.login_url = None
              self.ip = None
              self.failed = None
              self.proc = None
              self.lock = threading.Lock()

          def code_ok(self, given):
              return hmac.compare_digest(normalise(given).encode(), self.code.encode())


      def run_tailscale(state, hostname):
          """`tailscale up` without a key prints a login link and waits for the login."""
          try:
              state.proc = proc = subprocess.Popen(
                  ["tailscale", "up", f"--hostname={hostname}"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
          except OSError as exc:
              state.failed = f"could not start tailscale: {exc}"
              return
          for line in proc.stdout:
              match = LOGIN_URL_RE.search(line)
              if match and state.login_url is None:
                  with state.lock:
                      state.login_url = match.group(0)
                  log("login link ready — waiting for the code on the setup page.")
          if proc.wait() != 0 and tailnet_ip() is None:
              state.failed = "tailscale up ended without joining (see the lines above)."


      PAGE = """<!doctype html>
      <html lang="en"><head><meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>palaia setup</title>
      <style>
      body{{font:17px/1.5 system-ui,sans-serif;max-width:32rem;margin:3rem auto;padding:0 1rem;color:#1d1d1f}}
      h1{{font-size:1.5rem}} input{{font:inherit;padding:.5rem;width:100%;box-sizing:border-box;letter-spacing:.1em}}
      button,a.btn{{display:inline-block;font:inherit;margin-top:1rem;padding:.6rem 1.2rem;border:0;border-radius:.5rem;
      background:#2457d6;color:#fff;text-decoration:none;cursor:pointer}}
      .err{{color:#b3261e}} .muted{{color:#666}}
      </style></head><body><h1>palaia setup</h1>{body}</body></html>"""


      def code_form(error=""):
          hint = f'<p class="err">{html.escape(error)}</p>' if error else ""
          return (
              "<p>Enter the setup code you were given.</p>"
              f"{hint}"
              '<form method="get" action="/connect"><input name="code" autocomplete="off" autofocus '
              'placeholder="XXXX-XXXX-XXXX"><button type="submit">Continue</button></form>'
          )


      def connect_body(state, code):
          if state.ip:
              return done_body(state)
          if state.failed:
              return f'<p class="err">Something went wrong: {html.escape(state.failed)}</p>'
          if not state.login_url:
              return (
                  "<p>Preparing the connection — this takes a few seconds.</p>"
                  "<script>setTimeout(()=>location.reload(),3000)</script>"
              )
          status_url = "/status?code=" + html.escape(normalise(code))
          return (
              "<p>One last step: connect this server to your private network. "
              "Log in with the Tailscale account you use on your own devices.</p>"
              f'<a class="btn" href="{html.escape(state.login_url)}" target="_blank" '
              'rel="noopener">Connect with Tailscale</a>'
              '<p class="muted" id="wait">Waiting for you to log in…</p>'
              "<script>setInterval(async()=>{"
              f'const r=await fetch("{status_url}");const s=await r.json();'
              "if(s.joined)location.reload();},3000)</script>"
          )


      def done_body(state):
          url = f"http://{state.ip}:{state.port}/"
          return (
              "<p><strong>Done.</strong> This server is now on your private network.</p>"
              f"<p>In a minute or two, palaia opens at <a href=\"{html.escape(url)}\">"
              f"{html.escape(url)}</a> — from any device where the Tailscale app is on.</p>"
              '<p class="muted">This setup page closes itself now.</p>'
          )


      class BoundedServer(ThreadingHTTPServer):
          """One thread per connection, but never more than MAX_CLIENTS at once."""

          daemon_threads = True

          def __init__(self, *args, **kwargs):
              super().__init__(*args, **kwargs)
              self.slots = threading.BoundedSemaphore(MAX_CLIENTS)

          def process_request(self, request, client_address):
              if not self.slots.acquire(blocking=False):
                  self.shutdown_request(request)
                  return
              try:
                  super().process_request(request, client_address)
              except Exception:
                  self.slots.release()
                  raise

          def process_request_thread(self, request, client_address):
              try:
                  super().process_request_thread(request, client_address)
              finally:
                  self.slots.release()


      def make_handler(state):
          class Handler(BaseHTTPRequestHandler):
              timeout = CLIENT_TIMEOUT

              def log_message(self, *args):
                  pass

              def send(self, status, body, ctype="text/html; charset=utf-8"):
                  data = body.encode()
                  self.send_response(status)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(data)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("Referrer-Policy", "no-referrer")
                  self.end_headers()
                  self.wfile.write(data)

              def do_GET(self):
                  parsed = urlparse(self.path)
                  code = parse_qs(parsed.query).get("code", [""])[0]
                  if parsed.path == "/":
                      return self.send(200, PAGE.format(body=code_form()))
                  if parsed.path not in ("/connect", "/status"):
                      return self.send(404, PAGE.format(body="<p>Not found.</p>"))
                  if not state.code_ok(code):
                      time.sleep(WRONG_CODE_DELAY)
                      if parsed.path == "/status":
                          return self.send(403, json.dumps({"joined": False}), "application/json")
                      return self.send(403, PAGE.format(body=code_form("That code is not right.")))
                  if parsed.path == "/status":
                      return self.send(200, json.dumps({"joined": bool(state.ip)}), "application/json")
                  return self.send(200, PAGE.format(body=connect_body(state, code)))

          return Handler


      def main(argv=None):
          parser = argparse.ArgumentParser(description=__doc__)
          parser.add_argument("--port", type=int, default=8420, help="where this page listens")
          parser.add_argument("--hub-port", type=int, default=8420, help="where palaia will answer")
          parser.add_argument("--bind", default="0.0.0.0")
          parser.add_argument("--hostname", default="palaia-hub")
          parser.add_argument("--timeout", type=int, default=1800, help="seconds")
          parser.add_argument("--linger", type=int, default=30, help="seconds to show 'done'")
          args = parser.parse_args(argv)

          code = os.environ.get("PALAIA_SETUP_CODE", "").strip() or new_code()
          if len(normalise(code)) < 8:
              log("ERROR: PALAIA_SETUP_CODE is shorter than 8 characters.")
              return 2

          state = State(code, args.hub_port)
          if tailnet_ip():
              log("this server is already on a tailnet — nothing to set up.")
              return 0

          # A plain `kill` (SIGTERM) or a closed terminal (SIGHUP) must still run the
          # clean-up below, not leave the page or a pending login behind.
          def stop(signum, _frame):
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, stop)
          signal.signal(signal.SIGHUP, stop)

          server = BoundedServer((args.bind, args.port), make_handler(state))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          threading.Thread(target=run_tailscale, args=(state, args.hostname), daemon=True).start()
          print(
              "\n"
              "  ============================================================\n"
              f"   Open   http://{public_address()}:{args.port}/\n"
              f"   Code   {code}\n"
              "   Then click 'Connect with Tailscale' and log in.\n"
              "  ============================================================\n",
              flush=True,
          )

          deadline = time.monotonic() + args.timeout
          try:
              while time.monotonic() < deadline and not state.failed:
                  ip = tailnet_ip()
                  if ip:
                      state.ip = ip
                      log(f"joined the tailnet as {ip}.")
                      time.sleep(args.linger)
                      return 0
                  time.sleep(2)
          finally:
              server.shutdown()
              server.server_close()
              if state.proc and state.proc.poll() is None:
                  state.proc.terminate()
                  try:
                      state.proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      state.proc.kill()
              if not state.ip:
                  # Drop the pending login, so the link can no longer be used by
                  # anyone to pull this server into their network.
                  try:
                      subprocess.run(["tailscale", "logout"], capture_output=True, timeout=30, check=False)
                  except (OSError, subprocess.TimeoutExpired):
                      log("could not reset the pending Tailscale login — run 'tailscale logout'.")
          log(f"ERROR: {state.failed or 'nobody completed the setup page in time'} — the page is closed.")
          return 1


      if __name__ == "__main__":
          sys.exit(main())
  - path: /opt/palaia/cloud-init-setup.sh
    permissions: "0700"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # Written by cloud-init.yaml — see that file for the one thing to
      # edit. Every step below is guarded so re-running this script (a
      # second cloud-init boot, or by hand) changes nothing already done.
      set -euo pipefail

      log() { echo "palaia cloud-init: $*"; }

      PALAIA_SETUP_CODE="setup-code-REPLACE_ME"
      TAILSCALE_AUTH_KEY="tskey-REPLACE_ME"
      # rc-channel-note — during the 3.0.0 release candidate the `stable`
      # image does not exist yet (the release workflow only creates it on the
      # final tag), so this file pulls `:beta`, the pre-release channel, which
      # is a real published image. Unlike the `docker run`/compose commands a
      # person types and can adjust, this file is pasted once and boots
      # unattended — so it pins a tag that actually exists now rather than a
      # note asking the reader to swap one. RELEASING.md §3 flips this back to
      # `:stable` on the final tag; server/tests/test_version_drift.py enforces
      # which tag is correct for the current v3/VERSION.
      IMAGE="ghcr.io/byte5ai/palaia-hub:beta"
      CONTAINER_NAME="palaia-hub"
      VOLUME="palaia_home"
      PORT=8420

      # Which way to join the tailnet: a filled-in key wins; otherwise the
      # setup page with the filled-in code. The checks below look only for
      # the marker word, so a copy where every placeholder was replaced
      # still passes them.
      USE_KEY=1
      case "${TAILSCALE_AUTH_KEY}" in *REPLACE_ME*|"") USE_KEY=0 ;; esac
      if [ "$USE_KEY" = "0" ]; then
          case "${PALAIA_SETUP_CODE}" in
              *REPLACE_ME*|"")
                  log "ERROR: edit this file's PALAIA_SETUP_CODE (or TAILSCALE_AUTH_KEY) before pasting it."
                  exit 1 ;;
          esac
      fi

      # --- Docker --------------------------------------------------------
      if ! command -v docker >/dev/null 2>&1; then
          log "installing Docker ..."
          curl -fsSL https://get.docker.com | sh
      else
          log "Docker already installed, skipping."
      fi
      systemctl enable --now docker

      # --- Tailscale -------------------------------------------------------
      # A different private network entirely? Swap this install step and
      # the `tailscale up`/`tailscale0` lines below for your VPN's own join
      # step and interface name — the firewall rule further down is the
      # only other line that names it.
      if ! command -v tailscale >/dev/null 2>&1; then
          log "installing Tailscale ..."
          curl -fsSL https://tailscale.com/install.sh | sh
      else
          log "Tailscale already installed, skipping."
      fi
      systemctl enable --now tailscaled

      if tailscale ip -4 >/dev/null 2>&1; then
          log "already on a tailnet, skipping the join."
      elif [ "$USE_KEY" = "1" ]; then
          log "joining the tailnet ..."
          tailscale up --auth-key="${TAILSCALE_AUTH_KEY}" --hostname="palaia-hub"
      else
          log "setup page: open http://<this server's address>:${PORT}/ and enter your setup code ..."
          PALAIA_SETUP_CODE="${PALAIA_SETUP_CODE}" python3 /opt/palaia/setup-page.py \
              --port "${PORT}" --hub-port "${PORT}" --hostname palaia-hub </dev/null || {
              log "ERROR: the setup page closed without joining the tailnet — re-run"
              log "  sudo bash /opt/palaia/cloud-init-setup.sh for a new page."
              exit 1
          }
      fi
      TAILSCALE_IP="$(tailscale ip -4)"
      log "tailnet address: ${TAILSCALE_IP}"

      # --- Firewall: the hub port, reachable via the tailnet only -----------
      # Two independent layers, so one weak spot does not undo the other:
      # binding docker's published port to the tailnet address itself
      # (below, in the `docker run` line) means nothing is even listening
      # on the public interface; this ufw rule denies the port there too,
      # for anything that ever changes that bind.
      if command -v ufw >/dev/null 2>&1; then
          ufw allow OpenSSH >/dev/null 2>&1 || true
          ufw allow in on tailscale0 to any port "${PORT}" proto tcp \
              comment 'palaia hub, tailnet only'
          ufw --force enable
          log "ufw enabled: ${PORT}/tcp reachable on the tailscale0 interface only."
      else
          log "ufw not found — skipping the firewall rule; the docker publish"
          log "  below already binds to the tailnet address only, regardless."
      fi

      # --- The hub -----------------------------------------------------------
      if docker inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
          log "container '${CONTAINER_NAME}' already exists, leaving it as-is."
      else
          log "pulling ${IMAGE} ..."
          docker pull "${IMAGE}"
          log "starting ${CONTAINER_NAME} on ${TAILSCALE_IP}:${PORT} (tailnet only) ..."
          # Hardening flags mirror install.sh / docker-compose.yml
          # (SPEC-502) verbatim — checked by
          # server/tests/deploy/test_cloud_init.py's drift test. Only the
          # `-p` bind address differs from install.sh's own, on purpose:
          # binding to the tailnet address (not `0.0.0.0`) is what keeps
          # the hub off the public internet.
          docker run -d \
              --name "${CONTAINER_NAME}" \
              -p "${TAILSCALE_IP}:${PORT}:8420" \
              -v "${VOLUME}:/data" \
              --restart unless-stopped \
              --security-opt no-new-privileges:true \
              --cap-drop ALL \
              --read-only \
              --tmpfs /tmp \
              --tmpfs /run \
              "${IMAGE}"
      fi

      log "done. Open http://${TAILSCALE_IP}:${PORT}/ from any device on your tailnet."

runcmd:
  - [bash, /opt/palaia/cloud-init-setup.sh]
  - [systemctl, daemon-reload]
