[project]
name = "palaia-hub"
dynamic = ["version"]
description = "palaia v3 hub daemon (Python core)"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "fastmcp==3.4.7",
]

[project.scripts]
palaia-hub = "palaia_hub.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/palaia_hub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/palaia_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
