[project]
name = "palaia-v3-workspace"
version = "0.0.0"
description = "palaia v3 workspace root (virtual — no code of its own)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["server"]
exclude = ["spikes/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["server/src"]

[tool.uv]
package = false

[tool.uv.sources]
palaia-hub = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "palaia-hub"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
