<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary · secondary · ghost · danger · disabled · signal · in-flight" viewport="700x220" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">Primary · Secondary · Ghost · Danger · Disabled · Signal</div>
<div class="row" style="gap:10px">
  <span class="btn btn-primary">Send</span>
  <span class="btn btn-secondary">Cancel</span>
  <span class="btn btn-ghost">Back</span>
  <span class="btn btn-danger">Delete</span>
  <span class="btn btn-disabled">Send</span>
  <span class="btn btn-signal">Upgrade</span>
</div>
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase;margin-top:6px">Primary in flight · the only spinner exception</div>
<div class="row" style="gap:10px">
  <span class="btn btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 2 15 22 11 13 2 9 22 2"/></svg>Send</span>
  <span class="btn btn-primary" style="opacity:0.95">Sending<span style="display:inline-block;width:14px">…</span></span>
</div>
</body></html>
