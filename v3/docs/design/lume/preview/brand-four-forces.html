<!doctype html>
<!-- @dsCard group="Brand" name="Four forces" subtitle="Surface · accent · borders · soft corners" viewport="700x240" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>The four forces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">Everything in Lume composes from these</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px">
  <div>
    <div class="swatch" style="height:72px;background:linear-gradient(180deg,#FFFFFF 0%,#E8EBEE 100%)"></div>
    <div class="lume-body-sm" style="font-weight:600;margin-top:8px">Surface luminosity</div>
    <div class="lume-body-sm" style="color:var(--text-secondary)">Every surface is a 180° gradient pair.</div>
  </div>
  <div>
    <div style="height:72px;border-radius:8px;background:linear-gradient(180deg,var(--bg-surface-raised-top),var(--bg-surface-raised-btm));border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top);box-shadow:0 0 6px var(--accent-glow-core),0 4px 18px var(--accent-glow-strong) inset, 0 1px 0 var(--top-edge-highlight) inset;display:grid;place-items:center">
      <span style="display:inline-block;width:40px;height:18px;border-radius:6px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));box-shadow:0 0 4px var(--accent-glow-core),0 4px 12px var(--accent-glow)"></span>
    </div>
    <div class="lume-body-sm" style="font-weight:600;margin-top:8px">Accent as illumination</div>
    <div class="lume-body-sm" style="color:var(--text-secondary)">Fill + glow · two visual forms.</div>
  </div>
  <div>
    <div style="height:72px;border-radius:8px;background:linear-gradient(180deg,var(--bg-surface-raised-top),var(--bg-surface-raised-btm));border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top);box-shadow:0 1px 0 var(--top-edge-highlight) inset"></div>
    <div class="lume-body-sm" style="font-weight:600;margin-top:8px">Directional borders</div>
    <div class="lume-body-sm" style="color:var(--text-secondary)">Top lighter, btm + sides stronger.</div>
  </div>
  <div>
    <div class="row" style="gap:6px;align-items:end;height:72px;padding:8px 4px">
      <div style="width:30px;height:30px;background:var(--bg-surface-sunken-btm);border:1px solid var(--border-strong-btm);border-radius:0"></div>
      <div style="width:30px;height:42px;background:linear-gradient(180deg,var(--bg-surface-raised-top),var(--bg-surface-raised-btm));border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top);border-radius:6px"></div>
      <div style="width:30px;height:54px;background:linear-gradient(180deg,var(--bg-surface-raised-top),var(--bg-surface-raised-btm));border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top);border-radius:10px"></div>
      <div style="width:30px;height:64px;background:linear-gradient(180deg,var(--bg-surface-raised-top),var(--bg-surface-raised-btm));border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top);border-radius:12px"></div>
    </div>
    <div class="lume-body-sm" style="font-weight:600;margin-top:8px">Soft corners w/ editor exception</div>
    <div class="lume-body-sm" style="color:var(--text-secondary)">Radius 0 marks the editor boundary.</div>
  </div>
</div>
</body></html>
