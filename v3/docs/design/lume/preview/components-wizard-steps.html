<!doctype html>
<!-- @dsCard group="Components" name="Wizard step-bar" subtitle="Completed · current (donut glow) · upcoming" viewport="700x160" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>Wizard step-bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">Completed · current (donut glow) · upcoming</div>
<div class="row" style="gap:0;padding:24px 16px">
  <div style="width:18px;height:18px;border-radius:50%;background:var(--accent-fill);box-shadow:0 0 6px var(--accent-glow)"></div>
  <div style="flex:1;height:2px;background:var(--accent-fill);box-shadow:0 0 6px var(--accent-glow);max-width:120px"></div>
  <div style="width:18px;height:18px;border-radius:50%;background:var(--accent-fill);box-shadow:0 0 6px var(--accent-glow)"></div>
  <div style="flex:1;height:2px;background:linear-gradient(90deg,var(--accent-fill) 0%,var(--border-subtle-btm) 100%);max-width:120px"></div>
  <div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--accent-fill);background:radial-gradient(circle,var(--accent-subtle) 0%,var(--accent-subtle) 35%,var(--accent-glow-core) 75%,transparent 100%);box-shadow:0 0 12px var(--accent-glow-core),0 0 22px -4px var(--accent-glow-strong)"></div>
  <div style="flex:1;height:2px;background:var(--border-subtle-btm);max-width:120px"></div>
  <div style="width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top)"></div>
</div>
<div class="row" style="gap:0;justify-content:space-between;padding:0 4px">
  <div class="lume-caption" style="color:var(--text-tertiary)">Source</div>
  <div class="lume-caption" style="color:var(--text-tertiary)">Shape</div>
  <div class="lume-caption" style="color:var(--text-primary)">Recipients</div>
  <div class="lume-caption" style="color:var(--text-tertiary)">Review</div>
</div>
</body></html>
