<!doctype html>
<!-- @dsCard group="Colors" name="Text colors" subtitle="primary · secondary · tertiary · disabled · on-accent" viewport="700x220" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>Text colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">Text tokens — light mode</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;align-items:baseline">
  <div class="lume-body" style="color:var(--text-primary)">text.primary · headings, body, data</div><div class="token-value">#1A1D20</div>
  <div class="lume-body" style="color:var(--text-secondary)">text.secondary · labels, captions</div><div class="token-value">#5A6068</div>
  <div class="lume-body" style="color:var(--text-tertiary)">text.tertiary · hints, placeholders</div><div class="token-value">#8A9098</div>
  <div class="lume-body" style="color:var(--text-disabled)">text.disabled · disabled controls</div><div class="token-value">#B8BDC2</div>
  <div style="background:var(--accent-fill);border-radius:6px;padding:2px 10px;width:fit-content"><span class="lume-body" style="color:var(--text-on-accent)">text.on-accent · #FFFFFF</span></div><div class="token-value">on accent fill</div>
</div>
</body></html>
