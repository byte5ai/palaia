<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Cards don't get shadows · modal carries accent-glow" viewport="700x200" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">Reserved for temporally elevated surfaces · not for cards</div>
<div class="row" style="gap:18px;padding:8px 8px 28px">
  <div style="text-align:center"><div style="width:108px;height:64px;border-radius:8px;background:#fff;border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top)"></div><div class="token-name" style="margin-top:8px">flat</div></div>
  <div style="text-align:center"><div style="width:108px;height:64px;border-radius:8px;background:#fff;box-shadow:var(--shadow-raised)"></div><div class="token-name" style="margin-top:8px">raised</div></div>
  <div style="text-align:center"><div style="width:108px;height:64px;border-radius:8px;background:#fff;box-shadow:var(--shadow-popover)"></div><div class="token-name" style="margin-top:8px">popover</div></div>
  <div style="text-align:center"><div style="width:108px;height:64px;border-radius:12px;background:#fff;box-shadow:0 4px 16px rgba(20,25,30,0.06),0 24px 48px rgba(20,25,30,0.12),0 0 32px var(--accent-glow-core),0 0 96px var(--accent-glow)"></div><div class="token-name" style="margin-top:8px">modal</div></div>
  <div style="text-align:center"><div style="width:108px;height:64px;border-radius:8px;background:#fff;opacity:0.85;box-shadow:var(--shadow-drag)"></div><div class="token-name" style="margin-top:8px">drag</div></div>
</div>
</body></html>
