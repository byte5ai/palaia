<!doctype html>

<head>

<title>Progress with underglow</title>

<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">4px track · accent fill reads as lit, not painted</div>
<div class="col" style="gap:14px;max-width:520px">

  </div>
  <div class="row" style="justify-content:space-between"><span class="lume-caption" style="color:var(--text-tertiary)">Resolving connectors</span><span class="lume-mono-sm" style="color:var(--text-secondary)">8 / 12</span></div>
