<!doctype html>
<!-- @dsCard group="Colors" name="Surface gradients" subtitle="Every surface is a 180° gradient pair" viewport="700x200" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>Surface gradients (light mode)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">Every surface is a 180° gradient · ~1.5% L delta</div>
<div class="row" style="gap:10px;flex-wrap:nowrap">
  <div style="flex:1">
    <div class="swatch" style="height:64px;background:linear-gradient(180deg,var(--bg-canvas-top),var(--bg-canvas-btm))"></div>
    <div class="token-name" style="margin-top:6px">bg.canvas</div>
    <div class="token-value">#F8F9FA → #F4F5F7</div>
  </div>
  <div style="flex:1">
    <div class="swatch" style="height:64px;background:linear-gradient(180deg,var(--bg-surface-top),var(--bg-surface-btm))"></div>
    <div class="token-name" style="margin-top:6px">bg.surface</div>
    <div class="token-value">#FFFFFF → #FAFBFC</div>
  </div>
  <div style="flex:1">
    <div class="swatch" style="height:64px;background:linear-gradient(180deg,var(--bg-surface-raised-top),var(--bg-surface-raised-btm));box-shadow:0 1px 0 var(--top-edge-highlight) inset"></div>
    <div class="token-name" style="margin-top:6px">bg.surface.raised</div>
    <div class="token-value">#FFFFFF → #F7F9FB</div>
  </div>
  <div style="flex:1">
    <div class="swatch" style="height:64px;background:linear-gradient(180deg,var(--bg-surface-sunken-top),var(--bg-surface-sunken-btm))"></div>
    <div class="token-name" style="margin-top:6px">bg.surface.sunken</div>
    <div class="token-value">#F4F5F7 → #EEF0F2</div>
  </div>
</div>
</body></html>
