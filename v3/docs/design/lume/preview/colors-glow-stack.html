<!doctype html>
<!-- @dsCard group="Colors" name="Accent glow stack" subtitle="Three-layer Spotlight glow recipe" viewport="700x280" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>Accent glow stack — three layers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">Outer corona · mid ring · bright white-shifted inner core</div>
<div style="height:200px;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg-surface-top),var(--bg-surface-btm));border-radius:var(--radius-lg);border:1px solid var(--border-subtle-btm);border-top-color:var(--border-subtle-top)">
  <div style="width:160px;height:48px;border-radius:var(--radius-md);background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));display:grid;place-items:center;color:#fff;font:500 14px/16px var(--font-sans);
       box-shadow:
        0 0 0 4px var(--accent-glow),
        0 0 16px var(--accent-glow-core),
        0 12px 40px var(--accent-glow-strong),
        inset 0 1px 0 rgba(255,255,255,0.22);">
    Spotlight glow
  </div>
</div>
<div class="row" style="gap:18px"><span class="token-name">accent.glow</span><span class="token-name">accent.glow-strong</span><span class="token-name">accent.glow-core</span></div>
</body></html>
