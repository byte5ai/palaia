<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 48 · 64" viewport="700x200" -->
<html lang="en" data-mode="light" data-accent="lagoon">
<head>
<meta charset="utf-8">
<title>Spacing scale — 4pt base</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
<div class="lume-caption" style="color:var(--text-tertiary);letter-spacing:0.04em;text-transform:uppercase">4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 48 · 64</div>
<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:100px">
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:4px;height:4px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">4</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:8px;height:8px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">8</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:12px;height:12px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">12</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:16px;height:16px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">16</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:20px;height:20px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">20</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:24px;height:24px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">24</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:32px;height:32px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">32</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:40px;height:40px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">40</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:42px;height:48px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">48</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:42px;height:64px;background:linear-gradient(180deg,var(--accent-fill),var(--accent-fill-hover));border-radius:3px;box-shadow:0 0 6px var(--accent-glow)"></div>
      <div class="token-name">64</div>
    </div>
</div>
<div class="lume-mono-sm" style="color:var(--text-tertiary)">space.1 · space.2 · space.3 · space.4 · space.5 · space.6 · space.8 · space.10 · space.12 · space.16</div>
</body></html>
